name: Require Version Label

on:
  pull_request:
    types: [opened, edited, labeled, unlabeled, synchronize]

jobs:
  check-labels:
    runs-on: ubuntu-latest

    steps:
      - name: Validate version label
        run: |
          LABELS='${{ toJson(github.event.pull_request.labels) }}'

          COUNT=0

          for label in major minor patch no-release; do
            if echo "$LABELS" | grep -q "\"name\":\"$label\""; then
              COUNT=$((COUNT+1))
            fi
          done

          echo "Detected version labels: $COUNT"

          if [ "$COUNT" -ne 1 ]; then
            echo "❌ PR must have exactly ONE of: major, minor, patch, no-release"
            exit 1
          fi

          echo "✅ Label requirement satisfied"