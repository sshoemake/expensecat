name: Require Version Label

on:
  pull_request:
    types: [opened, edited, labeled, unlabeled, synchronize]

jobs:
  check-labels:
    runs-on: ubuntu-latest

    steps:
      - name: Validate version label
        run: |
          set -euo pipefail

          MATCHING=$(echo '${{ toJson(github.event.pull_request.labels) }}' \
            | jq -r '[.[].name | select(. == "major" or . == "minor" or . == "patch" or . == "no-release")]')

          COUNT=$(echo "$MATCHING" | jq 'length')

          echo "Matching labels: $MATCHING"
          echo "Detected version labels: $COUNT"

          if [ "$COUNT" -ne 1 ]; then
            echo "❌ Found $COUNT matching labels. Expected exactly ONE of: major, minor, patch, no-release"
            exit 1
          fi

          echo "✅ Label requirement satisfied"