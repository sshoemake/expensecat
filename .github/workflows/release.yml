name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # needed for tags

      - name: Get latest tag
        id: latest
        run: |
          git fetch --tags
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Determine bump type from labels (strict + skip)
        id: bump_type
        run: |
          set -euo pipefail

          LABELS='${{ toJson(github.event.pull_request.labels) }}'

          # Check for skip first
          SKIP=$(echo "$LABELS" | jq '[.[].name | select(. == "no-release")] | length')

          if [ "$SKIP" -gt 0 ]; then
            echo "Skipping release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract matching version labels
          MATCHES=$(echo "$LABELS" | jq -r '[.[].name | select(IN("major","minor","patch"))]')

          COUNT=$(echo "$MATCHES" | jq 'length')

          if [ "$COUNT" -ne 1 ]; then
            echo "❌ Must have exactly one of: major, minor, patch"
            echo "Found: $MATCHES"
            exit 1
          fi

          TYPE=$(echo "$MATCHES" | jq -r '.[0]')

          echo "type=$TYPE" >> "$GITHUB_OUTPUT"

      - name: Calculate next version
        id: bump
        run: |
          CURRENT=${{ steps.latest.outputs.tag }}
          TYPE=${{ steps.bump_type.outputs.type }}

          VERSION=${CURRENT#v}

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          if [ "$TYPE" = "major" ]; then
            MAJOR=$((MAJOR+1))
            MINOR=0
            PATCH=0
          elif [ "$TYPE" = "minor" ]; then
            MINOR=$((MINOR+1))
            PATCH=0
          else
            PATCH=$((PATCH+1))
          fi

          NEW_VERSION="v$MAJOR.$MINOR.$PATCH"

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Next version: $NEW_VERSION"

      - name: Ensure tag doesn't already exist
        run: |
          git tag -l | grep "${{ steps.bump.outputs.version }}" && exit 1 || true

      - name: Create and push tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag ${{ steps.bump.outputs.version }}
          git push origin ${{ steps.bump.outputs.version }}

  build-and-release:
    needs: prepare
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: arm64

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build and package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -e

          OS="${{ matrix.os }}"
          ARCH="${{ matrix.arch }}"

          if [ "$OS" = "darwin" ]; then
            OS_NAME="macos"
          else
            OS_NAME="$OS"
          fi

          BIN_NAME="expensecat"
          DIST="dist"
          mkdir -p "$DIST"

          OUTPUT="$DIST/${BIN_NAME}"

          GOOS=$OS GOARCH=$ARCH \
          go build \
            -ldflags="-X main.version=${VERSION}" \
            -o "$OUTPUT" \
            .

          ARCHIVE="${BIN_NAME}-${VERSION}-${OS_NAME}-${ARCH}.tar.gz"
          tar -czf "$ARCHIVE" -C "$DIST" "$BIN_NAME"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          files: "*.tar.gz"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}