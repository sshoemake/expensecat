name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.setver.outputs.version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        
      - id: setver
        run: echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT

      - name: Validate version format
        run: |
          if [[ ! "${{ github.event.inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version"
            exit 1
          fi

      - name: Check tag doesn't exist
        run: |
          git fetch --tags
          git ls-remote --tags origin | grep "${{ github.event.inputs.version }}" && exit 1 || true

  build-and-release:
    needs: validate
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"


      - name: Build and package
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -e

          OS="${{ matrix.os }}"
          ARCH="${{ matrix.arch }}"

          # Normalize OS name for release artifacts
          if [ "$OS" = "darwin" ]; then
            OS_NAME="macos"
          else
            OS_NAME="$OS"
          fi

          BIN_NAME="expensecat"
          DIST="dist"
          mkdir -p "$DIST"

          OUTPUT="$DIST/${BIN_NAME}"

          # Build
          GOOS=$OS GOARCH=$ARCH \
          go build \
            -ldflags="-X main.version=${VERSION}" \
            -o "$OUTPUT" \
            .

          # Package
          ARCHIVE="${BIN_NAME}-${VERSION}-${OS_NAME}-${ARCH}.tar.gz"

          tar -czf "$ARCHIVE" -C "$DIST" "$BIN_NAME"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: "dist/*.tar.gz"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}








      - name: Build binary
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
          go build \
            -ldflags="-X 'main.version=${{ env.VERSION }}'" \
            -o "expensecat-${{ env.VERSION }}-${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.ext }}" \
            .

          tar -czf \
            "expensecat-${{ env.VERSION }}-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz" \
            "expensecat-${{ env.VERSION }}-${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.ext }}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: "*.tar.gz"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}