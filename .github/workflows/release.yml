name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.setver.outputs.version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - id: setver
        run: echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT

      - name: Validate version format
        run: |
          if [[ ! "${{ github.event.inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version"
            exit 1
          fi

      - name: Check tag doesn't exist
        run: |
          git fetch --tags
          git ls-remote --tags origin | grep "${{ github.event.inputs.version }}" && exit 1 || true

  build-and-release:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ""
            os_name: linux

          - os: linux
            arch: arm64
            ext: ""
            os_name: linux

          - os: darwin
            arch: amd64
            ext: ""
            os_name: macos

          - os: darwin
            arch: arm64
            ext: ""
            os_name: macos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build binary
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -e

          BIN_NAME="expensecat"
          OUTPUT_DIR="dist"
          mkdir -p "$OUTPUT_DIR"

          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
          go build \
            -ldflags="-X 'main.version=${VERSION}'" \
            -o "$OUTPUT_DIR/$BIN_NAME" \
            .

          tar -czf \
            "expensecat-${VERSION}-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz" \
            -C "$OUTPUT_DIR" \
            "$BIN_NAME"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}