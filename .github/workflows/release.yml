name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -o bin/expensecat-linux
          GOOS=darwin GOARCH=amd64 go build -o bin/expensecat-darwin
          GOOS=windows GOARCH=amd64 go build -o bin/expensecat.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/expensecat-linux
            bin/expensecat-darwin
            bin/expensecat.exe